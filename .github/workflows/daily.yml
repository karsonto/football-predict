name: daily

on:
  schedule:
    # 北京时间 09:17 起每半小时一次作为兜底。
    # GitHub 的 schedule 在高峰期会被大幅延迟（历史记录里 01:17 UTC 的这次实际跑到 07:xx UTC），
    # 甚至整晚丢掉，所以多排几次，由下面的步骤保证一天只真正跑一次。
    - cron: "17 1 * * *"
    - cron: "47 1 * * *"
    - cron: "17 2 * * *"
    - cron: "47 2 * * *"
    - cron: "17 3 * * *"
    - cron: "47 3 * * *"
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: 今天已经成功跑过就跳过
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          today=$(date -u +%Y-%m-%d)
          done=$(gh run list --repo "$REPO" --workflow daily.yml --event schedule \
            --limit 50 --json createdAt,conclusion \
            --jq "[.[] | select(.conclusion==\"success\") | select(.createdAt[0:10]==\"$today\")] | length" 2>/dev/null || echo "")
          case "$done" in ''|*[!0-9]*) done=0 ;; esac
          echo "今天已成功运行 $done 次"
          if [ "$done" -gt 0 ]; then
            echo "今天已经跑过，这次跳过。"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != '1'
      - run: python football_picker.py
        if: steps.guard.outputs.skip != '1'
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
